{% extends "base.html" %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1>Welcome Back</h1>

        <p>Login to continue reviewing your code with CodeLens AI.</p>

        {% if message %}
        <div class="alert">
            {{ message }}
        </div>
        {% endif %}

        <form method="POST">

            <input
                type="email"
                name="email"
                placeholder="Email Address"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p class="bottom-text">
            Don't have an account?
            <a href="{{ url_for('register') }}">
                Register
            </a>
        </p>

    </div>

</div>

{% endblock %}
